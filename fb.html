<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Example</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

       
        nav{
            background-color:#333;
            padding:15px;
        }

        nav ul{
            display:flex;
            list-style:none;
            justify-content:center;
            gap:40px;
        }

        nav ul li{
            color:white;
            font-size:18px;
            cursor:pointer;
        }


        .parent{
            display:flex;
            border:3px solid red;
            margin:30px;
            padding:20px;
            gap:20px;
            justify-content:center;
        }

        .child{
            width:100px;
            height:100px;
            border:2px solid black;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:24px;
            font-weight:bold;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Services</li>
            <li>Contact</li>
        </ul>
    </nav>

    <div class="parent">
        <div class="child">1</div>
        <div class="child">2</div>
        <div class="child">3</div>
        <div class="child">4</div>
        <div class="child">5</div>
    </div>

</body>
</html>
