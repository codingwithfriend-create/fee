<!DOCTYPE html>
<html>
<head>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:blue;
    height:100vh;
}

.box{
    width:90%;
    height:25%;
    background:white;
    border-radius: 0;

    display:flex;
    justify-content:center;
    align-items:center;
}


.container{
    position:relative;
    width:360px;
    height:220px;
}


/* common circle */
.circle{
    width:120px;
    height:120px;
    border-radius:50%;
    position:absolute;
    background:transparent;
    border:8px solid;
}


/* left circle */
.one{
    left:60px;
    top:50px;
    border-color:rgb(11, 1, 1);
}


/* right circle */
.three{
    left:180px;
    top:50px;
    border-color:rgb(1, 1, 14);
}


/* middle circle
   center is exactly the touching point
   of circle 1 and circle 3
*/
.two{
    left:120px;
    top:50px;
    border-color:rgb(1, 4, 1);
}


</style>
</head>

<body>

<div class="box">

<div class="container">

    <div class="circle one"></div>

    <div class="circle two"></div>

    <div class="circle three"></div>

</div>

</div>

</body>
</html>
