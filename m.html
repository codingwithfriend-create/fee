<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML Meme</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        background:#1e1e1e;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        font-family:Arial, Helvetica, sans-serif;
    }

    .meme{
        width:500px;
        background:white;
        border-radius:15px;
        overflow:hidden;
        box-shadow:0 0 20px rgba(0,0,0,.4);
    }

    .top{
        background:#ffcc00;
        text-align:center;
        padding:20px;
        font-size:32px;
        font-weight:bold;
    }

    .middle{
        padding:40px;
        text-align:center;
        background:#f5f5f5;
        font-size:22px;
        line-height:1.8;
    }

    .code{
        background:#222;
        color:#00ff88;
        padding:20px;
        font-family:monospace;
        font-size:18px;
    }

    .bottom{
        text-align:center;
        padding:20px;
    }

    button{
        padding:12px 24px;
        font-size:18px;
        border:none;
        border-radius:8px;
        background:#0078ff;
        color:white;
        cursor:pointer;
    }

    button:hover{
        background:#005fcc;
    }

    img{
        display:block;
        width:100%;
        max-height:400px;
        object-fit:contain;
        background:#eee;
    }
</style>
</head>
<body>

<div class="meme">
    <div class="top">😂 Random Meme Generator</div>

    <img id="memeImg" src="https://i.imgflip.com/30b1gx.jpg" alt="Random Meme">

    <div class="bottom">
        <form action="joke.html">
    <button type="submit">Generate Meme</button>
</form>
    </div>
</div>

<template id="joke">
<h1>😂 Oops!</h1>
<p><b>The "Generate Meme" button doesn't work...</b></p>
<p>Just like your brain during exams. 😜</p>
<p>(Relax, it's only a joke!)</p>
</template>
</body>
</html>
